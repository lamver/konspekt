<!DOCTYPE html>

<title>Konspekt — meeting notes that never leave your computer</title>
<meta name="description" content="A smart notepad for meetings. Records, transcribes and summarises entirely on your own computer. Free, open source, works offline.">

<!-- Три адреса, одна страница.

     Она отдаётся с lamver.github.io, konspekt.aisearch.tech (английский)
     и konspekt.aisearch.ru (русский). Для поиска это три дубля, и без
     подсказки он сам выберет главный, обычно не тот.

     robots.txt тут не помощник: он запрещает обход, а нам нужно, чтобы
     все копии обходились и склеивались в одну. Для этого есть canonical
     (какой адрес главный) и hreflang (какая копия для какого языка).
     Вдобавок robots.txt на github.io лежит в корне домена, который
     принадлежит не этому репозиторию, так что мы туда и не дотянемся.

     Главным объявлен konspekt.aisearch.tech: свой домен, а не адрес на
     чужой площадке, который завтра может смениться. Русская копия
     каноническая сама для себя: у неё другой язык и другой читатель,
     схлопывать её в английскую нельзя. -->
<link rel="canonical" href="https://konspekt.aisearch.tech/" id="canonical">
<link rel="alternate" hreflang="en" href="https://konspekt.aisearch.tech/">
<link rel="alternate" hreflang="ru" href="https://konspekt.aisearch.ru/">
<link rel="alternate" hreflang="x-default" href="https://konspekt.aisearch.tech/">

<!-- Русская копия должна быть канонической сама для себя, иначе поиск
     склеит её с английской и по-русски нас не найдут. Файл один на все
     адреса, поэтому подставляем canonical по домену прямо здесь, до
     отрисовки. Скрипт без defer намеренно: значение должно стоять в
     разметке к моменту, когда её читает робот. -->
<script>
  (function () {
    var свои = {
      'konspekt.aisearch.ru': 'https://konspekt.aisearch.ru/',
      'konspekt.aisearch.tech': 'https://konspekt.aisearch.tech/'
    };
    var адрес = свои[location.hostname.toLowerCase()];
    if (адрес) document.getElementById('canonical').href = адрес;
  })();
</script>

<style>
  /* Цвета взяты из самой программы: страница и приложение должны
     выглядеть одним продуктом, а не двумя разными. */
  :root {
    --bg: #14110f;
    --panel: #1c1917;
    --line: #2e2926;
    --text: #f5f0ea;
    --muted: #a49a90;
    --accent: #e8734a;
    --accent-soft: rgba(232, 115, 74, 0.12);
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.65;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 960px; margin: 0 auto; padding: 0 24px; }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* --- Переключатель языка --- */
  .langbar {
    display: flex;
    justify-content: flex-end;
    gap: 4px;
    padding: 16px 0 0;
  }
  .langbar button {
    background: none;
    border: 1px solid transparent;
    color: var(--muted);
    font: inherit;
    font-size: 0.85rem;
    padding: 4px 10px;
    border-radius: 6px;
    cursor: pointer;
  }
  .langbar button:hover { color: var(--text); }
  .langbar button[aria-pressed="true"] {
    color: var(--accent);
    border-color: var(--line);
    background: var(--accent-soft);
  }

  /* --- Шапка --- */
  header { padding: 48px 0 56px; text-align: center; }
  .logo {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin-bottom: 28px;
  }
  .logo span.mark {
    width: 22px; height: 22px;
    border-radius: 5px;
    background: var(--accent);
    display: inline-block;
  }
  h1 {
    font-size: clamp(1.9rem, 4.5vw, 2.9rem);
    line-height: 1.2;
    margin: 0 0 20px;
    letter-spacing: -0.02em;
  }
  .tagline {
    font-size: clamp(1rem, 2vw, 1.15rem);
    color: var(--muted);
    max-width: 640px;
    margin: 0 auto 12px;
  }
  .lead {
    color: var(--muted);
    max-width: 640px;
    margin: 0 auto 32px;
  }

  .download {
    display: inline-block;
    background: var(--accent);
    color: #1a0f0a;
    padding: 14px 32px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 1.02rem;
  }
  .download:hover { background: #f0855f; text-decoration: none; }
  .download-note { color: var(--muted); font-size: 0.88rem; margin: 12px 0 0; }
  .source-link { font-size: 0.9rem; margin-top: 6px; }

  /* Проверка антивирусами под кнопкой. Скрыта, пока не придёт ответ от
     GitHub: пустая или устаревшая плашка про вирусы хуже её отсутствия,
     ведь это ровно то место, где человек решает, доверять нам или нет. */
  .vt {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin: 14px 0 0;
    padding: 7px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 0.86rem;
    color: var(--muted);
    text-decoration: none;
  }
  .vt:hover { border-color: var(--accent); text-decoration: none; }
  .vt__dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #3fb950;
    flex-shrink: 0;
  }
  .vt--dirty .vt__dot { background: #d29922; }
  .vt__count { color: var(--ink); font-weight: 600; }

  /* --- Секции --- */
  section { padding: 56px 0; border-top: 1px solid var(--line); }
  h2 {
    font-size: clamp(1.3rem, 2.6vw, 1.7rem);
    margin: 0 0 28px;
    letter-spacing: -0.01em;
  }

  .features {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
  }
  .feature {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px 22px;
  }
  .feature h3 { margin: 0 0 8px; font-size: 1rem; }
  .feature p { margin: 0; color: var(--muted); font-size: 0.94rem; }

  /* --- Снимки --- */
  .shot { margin-bottom: 44px; }
  .shot:last-child { margin-bottom: 0; }
  .shot img {
    width: 100%;
    height: auto;
    display: block;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
  }
  .shot h3 { margin: 18px 0 6px; font-size: 1.05rem; }
  .shot p { margin: 0; color: var(--muted); font-size: 0.94rem; }

  .prose { color: var(--muted); max-width: 700px; margin: 0; }
  .prose + p { margin-top: 14px; }

  footer {
    border-top: 1px solid var(--line);
    padding: 32px 0 56px;
    color: var(--muted);
    font-size: 0.88rem;
    text-align: center;
  }
</style>

<!-- Счётчик посещений (OpenPanel, свой сервер op.ingdg.com).

     Считает только страницу проекта. В самой программе ничего подобного
     нет и не появится: обещание «ничего не уходит с компьютера»
     относится к встречам, а не к сайту, и нарушать его нельзя.

     Скрипт помечен defer, поэтому не задерживает показ страницы, а если
     сервер счётчика недоступен, страница просто работает без него.

     Файл лежит рядом со страницей и называется schet.js не для красоты.
     Раньше он грузился с openpanel.dev, а этот адрес прямо запрещён
     правилом ||openpanel.dev/op1.js в EasyPrivacy, uBlock privacy и
     AdGuard Tracking. У каждого посетителя с блокировщиком счётчик не
     загружался вовсе, и его визит не считался. Со своего домена и с
     нейтральным именем совпадений в 390 тысячах правил нет.

     При обновлении OpenPanel файл обновить копией с
     https://analytics.ingdg.com/op1.js -->
<script>
  window.op=window.op||function(){var n=[];return new Proxy(function(){arguments.length&&n.push([].slice.call(arguments))},{get:function(t,r){return"q"===r?n:function(){n.push([r].concat([].slice.call(arguments)))}} ,has:function(t,r){return"q"===r}}) }();
  window.op('init', {
    apiUrl: 'https://op.ingdg.com',
    clientId: '5c5c0aa1-4a0f-4f84-a792-9e1cd12b3fd8',
    trackScreenViews: true,
    trackOutgoingLinks: true,
    trackAttributes: true,
  });
</script>
<script src="schet.js" defer async></script>

<script src="i18n.js"></script>
<script>
/* Язык страницы.
 *
 * Порядок выбора: явный ?lang в адресе, сохранённый выбор человека,
 * язык домена, язык браузера, английский. Английский последним и как
 * запасной: страницу читают со всего мира, и показать незнакомый язык
 * хуже, чем показать язык, который понимают почти все.
 *
 * Домен идёт раньше браузера намеренно. Одна и та же страница отдаётся
 * с трёх адресов, и konspekt.aisearch.ru заведён именно как русский:
 * человек, пришедший туда по русской ссылке, должен увидеть русский,
 * даже если у него в браузере стоит английский. Но выбор человека и
 * ссылка с ?lang сильнее домена, иначе переключатель языков на .ru
 * работал бы вхолостую.
 *
 * Выбор кладётся в адрес (?lang=es), чтобы ссылкой на испанскую версию
 * можно было поделиться, и запоминается в localStorage.
 */

const LANGS = ['en', 'es', 'sr', 'ru'];

// Язык, закреплённый за доменом. Ключ сравнивается с концом имени узла,
// поэтому годятся и поддомены. Адреса без записи здесь (github.io,
// localhost) ведут себя по-старому: язык берётся из браузера.
const DOMAIN_LANGS = [
  ['konspekt.aisearch.ru', 'ru'],
  ['konspekt.aisearch.tech', 'en'],
];

function langFromDomain() {
  const host = location.hostname.toLowerCase();
  for (const [suffix, lang] of DOMAIN_LANGS) {
    if (host === suffix || host.endsWith('.' + suffix)) return lang;
  }
  return null;
}

function pickLang() {
  const fromUrl = new URLSearchParams(location.search).get('lang');
  if (LANGS.includes(fromUrl)) return fromUrl;

  try {
    const saved = localStorage.getItem('konspekt-lang');
    if (LANGS.includes(saved)) return saved;
  } catch (e) { /* приватный режим: не беда, пойдём дальше */ }

  const byDomain = langFromDomain();
  if (byDomain) return byDomain;

  for (const nav of navigator.languages || [navigator.language || '']) {
    const short = String(nav).slice(0, 2).toLowerCase();
    // Сербский приходит и как sr, и как sh, и с латиницей в хвосте.
    if (short === 'sh') return 'sr';
    if (LANGS.includes(short)) return short;
  }
  return 'en';
}

function setText(id, value) {
  const node = document.getElementById(id);
  if (node) node.textContent = value;
}

function render(lang) {
  const d = I18N[lang];
  if (!d) return;

  document.documentElement.lang = d.htmlLang;
  document.title = d.title;

  setText('t-title', d.title.replace(/^Konspekt\s*[—-]\s*/, ''));
  setText('t-tagline', d.tagline);
  setText('t-lead', d.lead);
  setText('t-download', d.download);
  // Язык уезжает вместе с событием скачивания: без него видно только
  // «скачали 40 раз», а надо знать, кому переводить дальше.
  const dl = document.getElementById('t-download');
  if (dl) dl.setAttribute('data-lang', lang);
  setText('t-download-note', d.downloadNote);
  setText('t-source-link', d.sourceLink);

  setText('t-features-title', d.featuresTitle);
  const features = document.getElementById('features');
  features.innerHTML = '';
  for (const [head, body] of d.features) {
    const card = document.createElement('div');
    card.className = 'feature';
    const h = document.createElement('h3');
    h.textContent = head;
    const p = document.createElement('p');
    p.textContent = body;
    card.append(h, p);
    features.append(card);
  }

  setText('t-shots-title', d.shotsTitle);
  const shots = document.getElementById('shots');
  shots.innerHTML = '';
  for (const [file, head, body] of d.shots) {
    const box = document.createElement('div');
    box.className = 'shot';
    const img = document.createElement('img');
    img.src = `screenshots/${lang}/${file}.png`;
    img.alt = head;
    // Первый снимок нужен сразу, остальные подождут прокрутки:
    // четыре картинки на входе — это лишние секунды на медленной сети.
    img.loading = file === 'summary' ? 'eager' : 'lazy';
    img.width = 1044;
    img.height = 721;
    const h = document.createElement('h3');
    h.textContent = head;
    const p = document.createElement('p');
    p.textContent = body;
    box.append(img, h, p);
    shots.append(box);
  }

  setText('t-privacy-title', d.privacyTitle);
  setText('t-privacy-text', d.privacyText);
  setText('t-langs-title', d.langsTitle);
  setText('t-langs-text', d.langsText);
  setText('t-verify-title', d.verifyTitle);
  setText('t-verify-text', d.verifyText);
  setText('t-license-title', d.licenseTitle);
  setText('t-license-text', d.licenseText);
  setText('t-license-link', d.licenseLink);

  // Подпись у виджета проверки на языке страницы, поэтому обновляем его
  // при каждой отрисовке, а не один раз при загрузке.
  показатьПроверку(lang);

  for (const btn of document.querySelectorAll('#langbar button')) {
    btn.setAttribute('aria-pressed', String(btn.dataset.lang === lang));
  }
}

function switchTo(lang) {
  try { localStorage.setItem('konspekt-lang', lang); } catch (e) { /* ничего */ }
  const url = new URL(location.href);
  url.searchParams.set('lang', lang);
  history.replaceState(null, '', url);
  render(lang);
}

function buildLangBar(current) {
  const bar = document.getElementById('langbar');
  for (const lang of LANGS) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.dataset.lang = lang;
    btn.textContent = I18N[lang].label;
    btn.setAttribute('aria-pressed', String(lang === current));
    btn.addEventListener('click', () => switchTo(lang));
    bar.append(btn);
  }
}

/* --- Проверка антивирусами -----------------------------------------------

   Виджета, который сам показывал бы свежий счёт, у VirusTotal нет: их
   API требует ключ, а класть ключ на публичную страницу нельзя — его
   заберёт первый же любопытный и сожжёт квоту.

   Но число у нас уже есть в надёжном месте. Сборка кладёт в описание
   релиза значок вида «VirusTotal-0%2F75» и ссылку на отчёт, а GitHub
   отдаёт описание браузеру без ключа и с разрешающим CORS. Значит,
   страница может спросить последний релиз и достать счёт оттуда:
   вышла новая версия — виджет обновился сам, править страницу не надо.

   Молчим, если что-то пошло не так. Плашка про вирусы стоит там, где
   человек решает, доверять нам или нет, и устаревшее или выдуманное
   число здесь хуже, чем его отсутствие. */

const РЕЛИЗЫ = 'https://api.github.com/repos/lamver/konspekt-releases/releases/latest';

/** Достать счёт проверки и ссылку на отчёт из описания релиза. */
function разобратьПроверку(описание) {
  if (typeof описание !== 'string') return null;
  // Значок из shields.io: «VirusTotal-0%2F75-brightgreen».
  const счёт = описание.match(/VirusTotal-(\d+)%2F(\d+)/);
  const отчёт = описание.match(/virustotal\.com\/gui\/file\/([a-f0-9]{64})/);
  if (!счёт || !отчёт) return null;
  const тревог = Number(счёт[1]);
  const всего = Number(счёт[2]);
  // Ноль движков — это не «всё чисто», это сломанный разбор.
  if (!Number.isFinite(тревог) || !Number.isFinite(всего) || всего <= 0) return null;
  return { тревог, всего, ссылка: 'https://www.virustotal.com/gui/file/' + отчёт[1] };
}

async function показатьПроверку(lang) {
  const узел = document.getElementById('t-vt');
  if (!узел) return;
  try {
    const ответ = await fetch(РЕЛИЗЫ, { headers: { Accept: 'application/vnd.github+json' } });
    if (!ответ.ok) return;
    const разбор = разобратьПроверку((await ответ.json()).body);
    if (!разбор) return;
    const d = I18N[lang] || I18N.en;
    const текст = document.getElementById('t-vt-text');
    if (текст) {
      текст.innerHTML = '';
      const число = document.createElement('span');
      число.className = 'vt__count';
      число.textContent = разбор.тревог + '/' + разбор.всего;
      текст.append(число, document.createTextNode(' ' + d.vtNote));
    }
    узел.href = разбор.ссылка;
    узел.classList.toggle('vt--dirty', разбор.тревог > 0);
    узел.hidden = false;
  } catch (e) {
    // Нет сети, GitHub недоступен, превышена квота: молча не показываем.
  }
}

const initial = pickLang();
buildLangBar(initial);
render(initial);
</script>

</body>
</html>
