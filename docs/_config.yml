# Настройки страницы проекта (GitHub Pages).
#
# Страница собирается из папки docs/, и по умолчанию туда уезжает всё её
# содержимое. Но docs/ — это ещё и рабочие записки: разборы, черновики
# маркетинга, инвентаризация строк. Они полезны нам и не предназначены
# постороннему читателю, поэтому исключены явно.
#
# Исключение — а не переезд в другую папку — потому что ссылки на эти
# файлы уже расставлены в ROADMAP.md и задачах.

exclude:
  - tasks/
  - транскрибация.md
  - licenses.md
