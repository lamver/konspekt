# Отчёт VirusTotal для уже выложенного релиза.
#
# Обычная сборка сканирует свежесобранный файл, а у людей на руках тот,
# что выложен: суммы разные, сборка не воспроизводима. Для 0.8.0 скана
# нет вовсе, он заработал после выпуска. В README при этом написано, что
# установщики проверяются, и человеку надо дать ссылку, а не обещание.
#
# Отдельный запуск по кнопке, потому что дело разовое: начиная со
# следующего выпуска ссылка появляется сама при сборке.

name: Отчёт VirusTotal

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Тег релиза, например v0.8.0
        required: true
        default: v0.8.0

jobs:
  # Идентификатор работы латиницей по требованию GitHub: в нём допустимы
  # только буквы латинского алфавита, цифры, дефис и подчёркивание.
  # Название на русском задаётся полем name ниже.
  report:
    name: Отчёт по выложенному релизу
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Проверить, что токен пускает в репозиторий релизов
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        # Чтение публичного репозитория удаётся и вовсе без токена,
        # поэтому удачный отчёт ничего не говорит о праве записи.
        # Отозванный или протухший RELEASES_TOKEN всплыл бы только в
        # момент выпуска, когда описание релиза уже надо править, —
        # и виноватым выглядел бы релиз, а не токен. Спрашиваем
        # права прямо и падаем сразу, с внятным объяснением.
        run: |
          can_push=$(gh api repos/lamver/konspekt-releases \
            --jq '.permissions.push' 2>&1) || {
              echo "::error::RELEASES_TOKEN не работает: $can_push"
              echo 'Заведите токен с правом записи в lamver/konspekt-releases и положите его в секрет RELEASES_TOKEN.' >> "$GITHUB_STEP_SUMMARY"
              exit 1
            }
          if [ "$can_push" != true ]; then
            echo '::error::RELEASES_TOKEN читает репозиторий, но писать не может: описание релиза не обновится.'
            exit 1
          fi
          echo 'RELEASES_TOKEN на месте, запись разрешена.' >> "$GITHUB_STEP_SUMMARY"

      - name: Запросить отчёт и дописать в релиз
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          # Описание релиза правится в соседнем репозитории, встроенному
          # токену туда нельзя.
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        # Имя поля латиницей не по забывчивости: в выражениях
        # ${{ inputs.… }} кириллица не разбирается, запуск падает с
        # «Unexpected symbol» ещё до первого шага.
        run: python tools/отчёт_вирустотал.py "${{ inputs.tag }}"
