# Проба: соберёт ли установщик тревогу у антивирусов. Без выпуска.
#
# Зачем отдельно от сборки по тегу. Чистота установщика проверялась
# только выпуском: узнаёшь о тревоге, когда файл уже у людей. А опыты
# («а если так собрать?») требуют десятка сборок, и выпускать ради
# каждой нельзя.
#
# Проверки здесь не гоняются: они проверяют код, а не сборку, и
# некоторые из них смотрят на уже опубликованную версию, так что старый
# код с ними не собрать вовсе.

name: Проба антивируса

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Что собрать (ветка, тег или коммит)
        required: true
        default: master
      own_bootloader:
        # Запускатель PyInstaller одинаков у тысяч программ, в том числе
        # вредоносных, и антивирусы клеймят его сам по себе. Собранный
        # из исходников на месте, он у нас свой.
        description: Собрать запускатель PyInstaller из исходников (yes/no)
        required: false
        default: 'no'

jobs:
  probe:
    name: Сборка и проверка антивирусами
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v3
        with:
          version: latest
          enable-cache: true

      - name: Установить зависимости
        run: uv sync --frozen --no-editable

      - name: Собрать запускатель из исходников
        if: inputs.own_bootloader == 'yes'
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: '1'
        shell: pwsh
        run: |
          $версия = uv run python -c "import PyInstaller; print(PyInstaller.__version__)"
          echo "PyInstaller $версия, собираем запускатель"
          uv pip install --reinstall --no-binary pyinstaller --no-cache "pyinstaller==$версия"
          uv run python -c "import PyInstaller, pathlib; p = pathlib.Path(PyInstaller.__file__).parent / 'bootloader' / 'Windows-64bit-intel' / 'runw.exe'; print(p, p.stat().st_size)"

      - name: Собрать установщик
        run: uv run python packaging/build.py

      - name: Посчитать сумму
        id: sum
        shell: pwsh
        run: |
          $exe = Get-Item dist/konspekt-*-setup.exe
          $сумма = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          echo "sha=$сумма" >> $env:GITHUB_OUTPUT
          echo "Установщик: $($exe.Name), $([math]::Round($exe.Length/1MB,1)) МБ, $сумма"

      - uses: actions/upload-artifact@v4
        with:
          name: установщик
          path: dist/konspekt-*-setup.exe
          retention-days: 3

      - name: Отправить в VirusTotal и дождаться разбора
        env:
          VT: ${{ secrets.VT_API_KEY }}
          # Питон на раннере Windows печатает в cp1252 и падает на
          # первой русской букве, уже получив ответ антивирусов.
          PYTHONIOENCODING: utf-8
        shell: bash
        # Имена переменных в bash латиницей: кириллицу он не считает
        # буквами, и «файл=...» принимает за команду. Первая версия так и
        # упала с кодом 127, все три пробы разом.
        run: |
          if [ -z "$VT" ]; then echo "нет ключа VT_API_KEY"; exit 1; fi
          file=$(ls dist/konspekt-*-setup.exe)
          url=$(curl -s -H "x-apikey: $VT" https://www.virustotal.com/api/v3/files/upload_url \
            | python -c "import json,sys; print(json.load(sys.stdin)['data'])")
          analysis=$(curl -s -H "x-apikey: $VT" -F "file=@$file" "$url" \
            | python -c "import json,sys; print(json.load(sys.stdin)['data']['id'])")
          for i in $(seq 1 60); do
            sleep 15
            status=$(curl -s -H "x-apikey: $VT" "https://www.virustotal.com/api/v3/analyses/$analysis" \
              | python -c "import json,sys; print(json.load(sys.stdin)['data']['attributes']['status'])")
            echo "разбор: $status"
            [ "$status" = "completed" ] && break
          done
          curl -s -H "x-apikey: $VT" \
            "https://www.virustotal.com/api/v3/files/${{ steps.sum.outputs.sha }}" -o report.json
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          а = json.load(open("report.json", encoding="utf-8"))["data"]["attributes"]
          итог = а["last_analysis_stats"]
          тревог = итог.get("malicious", 0) + итог.get("suspicious", 0)
          print(f"ТРЕВОГ: {тревог} из {sum(итог.values())}")
          for движок, вывод in sorted(а["last_analysis_results"].items()):
              if вывод.get("category") in ("malicious", "suspicious"):
                  print(f"- {движок}: {вывод.get('result')}")
          PY
