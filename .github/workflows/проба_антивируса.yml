# Проба: соберёт ли установщик тревогу у антивирусов. Без выпуска.
#
# Зачем отдельно от сборки по тегу. Чистота установщика проверялась
# только выпуском: узнаёшь о тревоге, когда файл уже у людей. А опыты
# («а если так собрать?») требуют десятка сборок, и выпускать ради
# каждой нельзя.
#
# Проверки здесь не гоняются: они проверяют код, а не сборку, и
# некоторые из них смотрят на уже опубликованную версию, так что старый
# код с ними не собрать вовсе.

name: Проба антивируса

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Что собрать (ветка, тег или коммит)
        required: true
        default: master
      own_bootloader:
        # Запускатель PyInstaller одинаков у тысяч программ, в том числе
        # вредоносных, и антивирусы клеймят его сам по себе. Собранный
        # из исходников на месте, он у нас свой.
        description: Собрать запускатель PyInstaller из исходников (yes/no)
        required: false
        default: 'no'
      compression:
        # Сжатие установщика. Пусто — как в выпуске (zip). Сильно
        # сжатый файл похож на упакованный вредонос, и машинное обучение
        # антивирусов это замечает (01.10, lzma2/max краснел каждый раз).
        description: Сжатие установщика (пусто — zip, lzma2/max, none)
        required: false
        default: ''

jobs:
  probe:
    name: Сборка и проверка антивирусами
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v3
        with:
          version: latest
          enable-cache: true

      - name: Установить зависимости
        run: uv sync --frozen --no-editable

      - name: Собрать запускатель из исходников
        if: inputs.own_bootloader == 'yes'
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: '1'
        shell: pwsh
        run: |
          $версия = uv run python -c "import PyInstaller; print(PyInstaller.__version__)"
          echo "PyInstaller $версия, собираем запускатель"
          uv pip install --reinstall --no-binary pyinstaller --no-cache "pyinstaller==$версия"
          uv run python -c "import PyInstaller, pathlib; p = pathlib.Path(PyInstaller.__file__).parent / 'bootloader' / 'Windows-64bit-intel' / 'runw.exe'; print(p, p.stat().st_size)"

      - name: Собрать установщик
        env:
          KONSPEKT_SETUP_COMPRESSION: ${{ inputs.compression }}
        run: uv run python packaging/build.py

      - name: Посчитать сумму
        id: sum
        shell: pwsh
        run: |
          $exe = Get-Item dist/konspekt-*-setup.exe
          $сумма = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          echo "sha=$сумма" >> $env:GITHUB_OUTPUT
          echo "Установщик: $($exe.Name), $([math]::Round($exe.Length/1MB,1)) МБ, $сумма"

      - uses: actions/upload-artifact@v4
        with:
          name: установщик
          path: dist/konspekt-*-setup.exe
          retention-days: 3

      # Вердикт выносит тот же страж, что стоит в выпуске по тегу: проба
      # заодно проверяет его вживую, на настоящем установщике.
      - name: Страж выпуска
        shell: pwsh
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          $exe = Get-Item dist/konspekt-*-setup.exe
          uv run python tools/страж_выпуска.py $exe.FullName | Tee-Object -FilePath страж.txt
          $код = $LASTEXITCODE
          Get-Content страж.txt -Encoding utf8 | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          exit $код

      # Отдельно сама программа, без установщика: понять, кто краснеет.
      # Тревога здесь пробу не роняет, она лишь сообщает.
      - name: Отдельно Konspekt.exe
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          uv run python tools/страж_выпуска.py (Get-Item dist/Konspekt/Konspekt.exe).FullName
