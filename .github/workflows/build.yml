# Сборка Konspekt под Windows.
#
# Тесты живут в tests.yml, здесь только сборка.
# Запускается на тег вида v* и по кнопке: собирать установщик на каждый
# push незачем, а минуты Windows-раннера стоят вдвое дороже обычных.

name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Проверка отката поднимает рабочее дерево на прошлом
          # теге, а при обрезанной истории тега здесь нет.
          fetch-depth: 0

      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установить uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest
          enable-cache: true

      - name: Установить зависимости
        run: uv sync --frozen --no-editable

      - name: Запустить быстрые тесты
        run: uv run python run_tests.py

      - name: Собрать дистрибутив
        run: uv run python packaging/build.py

      - name: Верифицировать сборку
        run: |
          $exe = Get-Item dist/konspekt-*-setup.exe
          if ($exe.Length -lt 50MB) { throw "Установщик слишком маленький: $($exe.Length/1MB) МБ" }
          if ($exe.Length -gt 70MB) { throw "Установщик слишком большой: $($exe.Length/1MB) МБ" }
          echo "Установщик собран: $($exe.Name), $($exe.Length/1MB) МБ"

      # Страж: установщик с тревогой антивируса к людям не уходит.
      # 0.10.1 ушла с тревогой Microsoft Defender, потому что скан шёл
      # после публикации и только дописывал результат в описание. Сборка
      # не воспроизводима до байта, и те же исходники то чисты, то нет;
      # если страж упал, перезапустите сборку — это тот же код.
      - name: Страж выпуска — проверка антивирусами до публикации
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          $exe = Get-Item dist/konspekt-*-setup.exe
          uv run python tools/страж_выпуска.py $exe.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Подписать происхождение сборки
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/konspekt-*-setup.exe

      # Сборка по кнопке, без тега: страж ей не нужен (выпускать нечего),
      # но знать, чиста ли сборка, полезно и здесь. Тот же страж, только
      # его провал не роняет сборку.
      #
      # Отдельного шага VirusTotal больше нет. Он заливал тот же файл,
      # что уже отправил страж, и VirusTotal отвечал 409 «уже есть»: на
      # 0.11.0 так упала вся сборка при чистом установщике. Значок с
      # отчётом в описание релиза дописывает tools/отчёт_вирустотал.py
      # после публикации (workflow «Отчёт VirusTotal»).
      - name: Проверка антивирусами (без выпуска)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        continue-on-error: true
        shell: pwsh
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          $exe = Get-Item dist/konspekt-*-setup.exe
          uv run python tools/страж_выпуска.py $exe.FullName

      # Релиз уезжает в публичный lamver/konspekt-releases, а не сюда:
      # Releases приватного репозитория отдаются только по токену, а
      # класть в дистрибутив токен с доступом к исходникам нельзя.
      # RELEASES_TOKEN — токен с правом записи только в тот репозиторий.
      # Требует секрет RELEASES_TOKEN: токен с правом записи только в
      # публичный репозиторий релизов. Без него шаг честно падает, потому
      # что релиз без файлов хуже, чем несобранный релиз.
      - name: Создать релиз в публичном репозитории
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          repository: lamver/konspekt-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: |
            dist/konspekt-*-setup.exe
            dist/SHA256SUMS
          generate_release_notes: true
