# Сборка Konspekt под Windows.
#
# Тесты живут в tests.yml, здесь только сборка.
# Запускается на тег вида v* и по кнопке: собирать установщик на каждый
# push незачем, а минуты Windows-раннера стоят вдвое дороже обычных.

name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Проверка отката поднимает рабочее дерево на прошлом
          # теге, а при обрезанной истории тега здесь нет.
          fetch-depth: 0

      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установить uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest
          enable-cache: true

      - name: Установить зависимости
        run: uv sync --frozen --no-editable

      - name: Запустить быстрые тесты
        run: uv run python run_tests.py

      - name: Собрать дистрибутив
        run: uv run python packaging/build.py

      - name: Верифицировать сборку
        run: |
          $exe = Get-Item dist/konspekt-*-setup.exe
          if ($exe.Length -lt 50MB) { throw "Установщик слишком маленький: $($exe.Length/1MB) МБ" }
          if ($exe.Length -gt 70MB) { throw "Установщик слишком большой: $($exe.Length/1MB) МБ" }
          echo "Установщик собран: $($exe.Name), $($exe.Length/1MB) МБ"

      - name: Подписать происхождение сборки
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/konspekt-*-setup.exe

      # Есть ли ключ VirusTotal, решаем отдельным шагом. Соблазнительно
      # написать в условии самого шага `env.VT_API_KEY != ''`, но env,
      # объявленный в том же шаге, в его собственном `if` не виден:
      # условие всегда ложно, и скан молча не запускается даже с ключом.
      # Такую поломку не видно вовсе — шаг просто числится пропущенным.
      - name: Проверить, есть ли ключ VirusTotal
        id: vt_key
        shell: bash
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          if [ -n "$VT_API_KEY" ]; then
            echo "has_key=yes" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=no" >> "$GITHUB_OUTPUT"
            echo "::notice::VT_API_KEY не задан, скан VirusTotal пропущен."
            echo "::notice::Ключ бесплатный (virustotal.com), кладётся в секреты как VT_API_KEY."
          fi

      - name: VirusTotal скан
        # Без ключа шаг пропускается: отсутствие сканера не повод ронять
        # весь релиз. Но пропуск теперь не молчаливый — предыдущий шаг
        # пишет об этом в сводку сборки.
        #
        # Отчёт VirusTotal нужен не для галочки: Konspekt пишет микрофон
        # и перехватывает клавиши, антивирусы принимают его за шпионскую
        # программу (issue #4 в konspekt-releases), и ссылка на отчёт —
        # единственный ответ, который что-то стоит.
        #
        # Скан идёт и по кнопке, не только на тег: иначе убедиться, что он
        # вообще работает, можно лишь настоящим выпуском, а узнавать о
        # поломке в момент релиза поздно. Ровно так и вскрылась прошлая.
        if: steps.vt_key.outputs.has_key == 'yes'
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: dist/konspekt-*-setup.exe
          # Дописывать отчёт некуда, пока релиза нет: только на теге.
          update_release_body: ${{ startsWith(github.ref, 'refs/tags/v') }}

      # Релиз уезжает в публичный lamver/konspekt-releases, а не сюда:
      # Releases приватного репозитория отдаются только по токену, а
      # класть в дистрибутив токен с доступом к исходникам нельзя.
      # RELEASES_TOKEN — токен с правом записи только в тот репозиторий.
      # Требует секрет RELEASES_TOKEN: токен с правом записи только в
      # публичный репозиторий релизов. Без него шаг честно падает, потому
      # что релиз без файлов хуже, чем несобранный релиз.
      - name: Создать релиз в публичном репозитории
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          repository: lamver/konspekt-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: |
            dist/konspekt-*-setup.exe
            dist/SHA256SUMS
          generate_release_notes: true
