# Прогон тестов для CI.
#
# Минуты Actions платные, поэтому: быстрые тесты на push и pull request,
# медленные раз в неделю и по кнопке.

name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 3 * * 1' # по понедельникам ночью
  workflow_dispatch:
    inputs:
      full:
        description: 'Прогнать и медленные тесты'
        type: boolean
        default: true

# Новый push отменяет предыдущий прогон той же ветки: незачем платить
# за проверку кода, который уже переписан.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: windows-latest
    name: Быстрые тесты
    steps:
      - uses: actions/checkout@v4
        with:
          # Проверка отката поднимает рабочее дерево на прошлом
          # теге, а при обрезанной истории тега здесь нет.
          fetch-depth: 0

      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установить uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest
          enable-cache: true

      - name: Установить зависимости
        run: uv sync --frozen --no-editable

      - name: Запустить быстрые тесты
        run: uv run python run_tests.py

  slow:
    runs-on: windows-latest
    name: Медленные тесты
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)
    needs: fast
    steps:
      - uses: actions/checkout@v4
        with:
          # Проверка отката поднимает рабочее дерево на прошлом
          # теге, а при обрезанной истории тега здесь нет.
          fetch-depth: 0

      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установить uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest
          enable-cache: true

      - name: Установить зависимости
        run: uv sync --frozen --no-editable

      - name: Запустить все тесты
        run: uv run python run_tests.py --full
