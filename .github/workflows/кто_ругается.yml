name: Кто ругается

on:
  workflow_dispatch:
    inputs:
      sha256:
        description: Сумма файла
        required: true

jobs:
  who:
    runs-on: ubuntu-latest
    steps:
      - name: Спросить VirusTotal, какие движки дали тревогу
        env:
          VT: ${{ secrets.VT_API_KEY }}
        run: |
          if [ -z "$VT" ]; then echo "нет ключа VT_API_KEY"; exit 1; fi
          curl -s -H "x-apikey: $VT" \
            "https://www.virustotal.com/api/v3/files/${{ inputs.sha256 }}" \
            -o отчёт.json
          python3 - <<'PY'
          import json
          данные = json.load(open("отчёт.json", encoding="utf-8"))
          атрибуты = данные["data"]["attributes"]
          print("итог:", атрибуты["last_analysis_stats"])
          print()
          for движок, вывод in sorted(атрибуты["last_analysis_results"].items()):
              if вывод.get("category") in ("malicious", "suspicious"):
                  print("ТРЕВОГА", движок, "->", вывод.get("result"))
          m = атрибуты["last_analysis_results"].get("Microsoft")
          print()
          print("Microsoft Defender:", (m or {}).get("result") or (m or {}).get("category"))
          PY
