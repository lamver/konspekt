[project]
name = "konspekt"
version = "0.5.5"
description = "Умный блокнот для встреч: локальная запись, распознавание и синтез заметок"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pywebview>=5.3",
    "pystray>=0.19.5",
    "pillow>=10.4",
    "pynput>=1.7.7",
    "soundcard>=0.4.3",
    "numpy>=2.0",
    "onnx-asr[cpu,hub]>=0.12.0",
    "av>=18.1.0",
    # Запросы к LLM и проверка новой версии. Вместо sdk от OpenAI:
    # тот тянет в билд десятки лишних мегабайт.
    "httpx>=0.28",
]

[project.scripts]
konspekt = "app.__main__:main"

# Нужны только тестам. В приложение не попадают: fonttools читает шрифты
# ради проверки кириллицы, самой программе это не требуется.
[dependency-groups]
dev = [
    "fonttools>=4.60",
    "brotli>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true
