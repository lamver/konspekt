[project]
name = "konspekt"
version = "0.1.0"
description = "Умный блокнот для встреч: локальная запись, распознавание и синтез заметок"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pywebview>=5.3",
    "pystray>=0.19.5",
    "pillow>=10.4",
    "pynput>=1.7.7",
]

[project.scripts]
konspekt = "app.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true
