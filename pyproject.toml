[project]
name = "konspekt"
version = "0.18.1"
description = "Умный блокнот для встреч: локальная запись, распознавание и синтез заметок"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pywebview>=5.3",
    "pystray>=0.19.5",
    "pillow>=10.4",
    "pynput>=1.7.7",
    "soundcard>=0.4.3",
    "numpy>=2.0",
    "onnx-asr[cpu,hub]>=0.12.0",
    # Intel Mac: onnxruntime с 1.24 не выпускает колёса под x86_64 macOS,
    # последняя с ними 1.23.2. Остальным системам это не мешает.
    "onnxruntime<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # Зеркальная строка нужна: без неё uv берёт одну версию 1.23 на всех.
    "onnxruntime>=1.29,<1.30; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # Та же история с cryptography (её тянет paramiko): с 49 колёс под
    # Intel Mac нет, uv собирает её из исходников с Homebrew OpenSSL, а
    # PyInstaller кладёт в образ старую libssl из Python, и импорт
    # падает на недостающем символе. 48.0.1 — последняя с колёсами.
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "cryptography>=50; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "av>=18.1.0",
    # Сверка языка по уже распознанному тексту (issue #2): акустический
    # определитель иногда уверенно ошибается на 3-4 секундах речи, и без
    # этой сверки одна ошибка заражает языком всю оставшуюся встречу.
    "py3langid>=0.3.0",
    # Запросы к LLM и проверка новой версии. Вместо sdk от OpenAI:
    # тот тянет в билд десятки лишних мегабайт.
    "httpx>=0.28",
    # Уведомления с кнопками. Раньше тост показывался запуском
    # powershell с -ExecutionPolicy Bypass в скрытом окне, и Microsoft
    # Defender в 0.9.0 счёл это трояном (Trojan:Win32/Wacatac.C!ml): для
    # эвристики это вылитое поведение закрепившегося зловреда. Defender
    # стоит у каждого, поэтому цена такой приметы — сломанная установка,
    # а не строчка в отчёте. Пара сотен килобайт дешевле.
    "winrt-Windows.UI.Notifications>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Data.Xml.Dom>=3.2; sys_platform == 'win32'",
    # Поиск по смыслу: модель читает не буквы, а номера кусочков слов, и
    # нарезать текст на эти кусочки надо ровно так, как её учили. Своя
    # нарезка «примерно так же» тихо портит ответы, а ошибку не видно:
    # поиск просто находит хуже. huggingface-hub, который она тянет, у
    # нас уже стоит ради onnx-asr.
    "tokenizers>=0.20",
    # Расшифровать запись по ссылке: yt-dlp как библиотека, без
    # отдельной программы и без ffmpeg (app/core/link.py). Unlicense.
    "yt-dlp>=2026.8.19",
    "paramiko>=3.4",
]

[project.scripts]
konspekt = "app.__main__:main"

# Нужны разработке, но не приложению: fonttools/brotli — тестам (проверка
# кириллицы в шрифтах), pyinstaller/pywin32 — сборке установщика.
[dependency-groups]
dev = [
    "fonttools>=4.60",
    "brotli>=1.1",
    "pyinstaller>=6.22",
    "pywin32>=306; sys_platform == 'win32'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true
